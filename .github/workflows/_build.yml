name: Build binaries

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Go compilation and download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/go
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-
            go-v1-${{ runner.os }}-${{ runner.arch }}-build-${{ matrix.goos }}-${{ matrix.goarch }}-
      - name: Build binary
        uses: mr-chelyshkin/actions/task-run@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          task: ci/golang/build
          args: |
            GOOS=${{ matrix.goos }}
            GOARCH=${{ matrix.goarch }}
