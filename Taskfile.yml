# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  golang:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/golang/Taskfile.yml
    internal: false
  proto:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/proto/Taskfile.yml
    internal: true
  markdown:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/markdown/Taskfile.yml
    internal: true
  node:
    # v0.1.0
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/3aa8c569bdc71b41fa50fc33f66e2ef1317813ed/taskfiles/node/Taskfile.yml
    internal: true
    vars:
      NODE_VERSION: '22.23.1'

vars:
  name: podium

  proto_repo: https://github.com/soltiHQ/proto.git
  proto_ref: v0.1.3
  proto_packages: agent discover task raft
  proto_plugins_dir: .cache/proto-plugins

  # The sha256 of the exact file each URL serves. Changing a version means
  # changing its hash: compare the file with the package in the npm registry
  # (dist.integrity covers the tarball) before pinning a new one.
  alpinejs_version: '3.13.5'
  alpinejs_sha256: ca057831ef9be3d8ee47e14078089fd2381dc7820b4bb7fbdb85a490f5b8f68c
  htmx_version: '1.9.12'
  htmx_sha256: 449317ade7881e949510db614991e195c3a099c4c791c24dacec55f9f4a2a452
  tailwind_version: '4.3.2'
  tailwind_command: |
    case "$(uname -m)" in
      x86_64) arch=x64 ;;
      aarch64) arch=arm64 ;;
      *) printf 'unsupported architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
    esac
    dir=.cache/tailwind/{{.tailwind_version}}
    bin="$dir/tailwindcss-linux-$arch"
    if [ ! -x "$bin" ]; then
      base=https://github.com/tailwindlabs/tailwindcss/releases/download/v{{.tailwind_version}}
      mkdir -p "$dir"
      curl -fsSL -o "$dir/sha256sums.txt" "$base/sha256sums.txt"
      curl -fsSL -o "$bin.download" "$base/tailwindcss-linux-$arch"
      expected=$(awk -v name="./tailwindcss-linux-$arch" '$2 == name { print $1 }' "$dir/sha256sums.txt")
      actual=$(sha256sum "$bin.download" | cut -d ' ' -f 1)
      if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
        printf 'tailwindcss-linux-%s: sha256 %s, expected %s\n' "$arch" "$actual" "$expected" >&2
        exit 1
      fi
      chmod +x "$bin.download"
      mv "$bin.download" "$bin"
    fi
    exec "$bin" --input ui/static/css/app.css --output ui/static/css/tailwindcss.css --minify

  js_assets_command: |
    fetch() {
      url=$1 want=$2 out=$3
      curl -fsSL -o "$out.download" "$url"
      actual=$(sha256sum "$out.download" | cut -d ' ' -f 1)
      if [ "$actual" != "$want" ]; then
        rm -f "$out.download"
        printf '%s: sha256 %s, expected %s\n' "$out" "$actual" "$want" >&2
        exit 1
      fi
      mv "$out.download" "$out"
    }
    fetch "https://cdn.jsdelivr.net/npm/alpinejs@{{.alpinejs_version}}/dist/cdn.min.js" {{.alpinejs_sha256}} ui/static/js/alpine.min.js
    fetch "https://unpkg.com/htmx.org@{{.htmx_version}}/dist/htmx.min.js" {{.htmx_sha256}} ui/static/js/htmx.min.js

  go_paths: api cmd domain internal ui
  markdown_paths: README.md

tasks:
  ci/markdown/fmt:
    desc: Check source Markdown formatting without modifying files
    cmds:
      - task: markdown:fmt
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  markdown/fix:
    desc: Format source Markdown with the same settings used in CI
    cmds:
      - task: markdown:fmt/fix
        vars:
          FMT_ARGS: '{{.markdown_paths}}'

  ci/ui/test:
    desc: Run the UI node tests (ui/tests/*.test.cjs)
    preconditions:
      # Node runs 0 tests and exits 0 for a glob that matches nothing, so a
      # moved or renamed test file would pass CI without a test.
      - sh: 'for f in ui/tests/*.test.cjs; do test -f "$f" && exit 0; done; exit 1'
        msg: 'no UI tests: ui/tests/*.test.cjs matches no file'
    cmds:
      - task: node:exec
        vars:
          # The container command runs without a shell, so Node expands the
          # quoted glob itself. The directory form (node --test ui/tests/)
          # fails on Node 22.
          CMD: node --test 'ui/tests/*.test.cjs'
          CONTAINER_MOUNT_MODE: ro

  ci/golang/fmt:
    desc: Run Go fmt check
    cmds:
      - task: golang:fmt
        vars:
          FMT_ARGS: '{{.go_paths}}'

  golang/fix:
    desc: Format Go sources with the same settings used in CI
    cmds:
      - task: golang:fmt/fix
        vars:
          FMT_ARGS: '{{.go_paths}}'

  ci/golang/lint:
    desc: Run Go lint
    cmds:
      - task: generate
      - task: golang:lint
        vars:
          LINT_ARGS: --timeout=5m ./...

  ci/golang/test:
    desc: Run Go tests with the race detector
    cmds:
      - task: generate
      - task: golang:test
        vars:
          TEST_ARGS: -race -count=1 -timeout=10m ./...

  ci/golang/audit:
    desc: Run Go vuln check
    cmds:
      - task: generate
      - task: golang:audit

  ci/golang/bench:
    desc: Run every Go benchmark once as a smoke check (not a performance gate)
    cmds:
      - task: generate
      - task: golang:test
        vars:
          TEST_ARGS: -run='^$' -bench=. -benchtime=1x ./...

  ci/golang/build:
    desc: Build the binary for GOOS/GOARCH (linux/amd64 by default)
    cmds:
      - task: generate
      - task: assets
      - task: assets/check
      - task: golang:build
        vars:
          NAME: '{{.name}}'
          GOOS: '{{.GOOS | default "linux"}}'
          GOARCH: '{{.GOARCH | default "amd64"}}'

  generate:
    desc: Vendor proto schemas, generate Go bindings and templ components
    cmds:
      - task: proto/vendor
      - task: proto/generate
      - task: templ/generate

  proto/vendor:
    desc: Vendor the soltiHQ/proto release pinned by proto_ref into api/proto
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        git -c advice.detachedHead=false clone --quiet --depth 1 --branch {{.proto_ref | shellQuote}} {{.proto_repo | shellQuote}} "$tmp"
        for pkg in {{.proto_packages}}; do
          rm -rf "api/proto/solti/$pkg"
          mkdir -p "api/proto/solti/$pkg"
          cp -R "$tmp/solti/$pkg/." "api/proto/solti/$pkg/"
        done
        printf 'vendored %s %s\n' {{.proto_repo | shellQuote}} {{.proto_ref | shellQuote}}

  proto/generate:
    desc: Generate Go bindings with the protoc plugins pinned in go.mod
    cmds:
      - task: golang:exec
        vars:
          CMD: go build -o {{.proto_plugins_dir}}/ google.golang.org/protobuf/cmd/protoc-gen-go google.golang.org/grpc/cmd/protoc-gen-go-grpc
          CONTAINER_ENVS: CGO_ENABLED=0
      - task: proto:exec
        vars:
          CMD: buf generate

  templ/generate:
    desc: Generate templ components with the templ version pinned in go.mod
    cmds:
      - task: golang:exec
        vars:
          CMD: go tool templ generate -path ui

  assets:
    desc: Download the JS dependencies and build the Tailwind CSS bundle
    cmds:
      - task: golang:exec
        vars:
          CMD: sh -euc {{.js_assets_command | shellQuote}}
      - task: golang:exec
        vars:
          CMD: sh -euc {{.tailwind_command | shellQuote}}

  assets/check:
    desc: Fail unless every UI asset the binary embeds exists
    internal: true
    preconditions:
      - sh: 'for f in ui/static/js/alpine.min.js ui/static/js/htmx.min.js ui/static/css/tailwindcss.css; do test -s "$f" || exit 1; done'
        msg: 'a UI asset is missing: run task assets (ui/static/js/alpine.min.js, htmx.min.js, css/tailwindcss.css)'
    cmds:
      - 'true'

  ci/docker/smoke:
    desc: Build the image from bin/ for the host's linux architecture and check a container of it (IMAGE=<ref> checks a published image instead)
    vars:
      image: '{{.IMAGE | default "podium-smoke:local"}}'
      container: podium-smoke
    preconditions:
      - sh: 'test -n "{{.IMAGE | default ""}}" || test -f bin/{{.name}}-linux-$(case "$(uname -m)" in x86_64) echo amd64 ;; *) echo arm64 ;; esac)'
        msg: 'bin/{{.name}}-linux-<arch> is missing: run task ci/golang/build GOOS=linux GOARCH=<arch>'
    cmds:
      - defer: docker rm -f {{.container}} >/dev/null 2>&1; docker rmi -f {{.image}} >/dev/null 2>&1; true
      - |
        set -eu
        case "$(uname -m)" in x86_64) arch=amd64 ;; *) arch=arm64 ;; esac
        docker rm -f {{.container}} >/dev/null 2>&1 || true
        if [ -z {{.IMAGE | default "" | shellQuote}} ]; then
          docker build --platform "linux/$arch" -t {{.image}} .
        fi
        # A generated throwaway secret: never a real one.
        secret=$(head -c 24 /dev/urandom | base64)
        docker run -d --name {{.container}} -e SOLTI_AUTH_JWT_SECRET="$secret" -p 127.0.0.1::8080 -p 127.0.0.1::8081 {{.image}} >/dev/null
        ops=$(docker port {{.container}} 8081/tcp | head -n 1)
        web=$(docker port {{.container}} 8080/tcp | head -n 1)
        ready=
        for _ in $(seq 1 60); do
          if curl -fs -o /dev/null "http://$ops/readyz"; then ready=1; break; fi
          sleep 1
        done
        if [ -z "$ready" ]; then
          printf 'smoke: /readyz never answered 200\n' >&2
          docker logs {{.container}} >&2 || true
          exit 1
        fi
        curl -fsS "http://$ops/version" | grep -q '"go_version"' || { printf 'smoke: /version has no go_version\n' >&2; exit 1; }
        code=$(curl -s -o /dev/null -w '%{http_code}' "http://$web/static/js/alpine.min.js")
        [ "$code" = 200 ] || { printf 'smoke: /static/js/alpine.min.js answered %s\n' "$code" >&2; exit 1; }
        # The image has no shell and ps has no uid column: the user column
        # shows uid 65532 by its name in the distroless passwd file, nonroot.
        user=$(docker top {{.container}} -o pid,user | sed 1d | head -n 1 | awk '{ print $2 }')
        case "$user" in nonroot|65532) ;; *) printf 'smoke: the process runs as %s, want uid 65532 (nonroot)\n' "$user" >&2; exit 1 ;; esac
        printf 'smoke ok: /readyz, /version, /static/js/alpine.min.js, uid 65532\n'

  prepare:
    desc: Generate sources and build the UI assets for a local run
    cmds:
      - task: generate
      - task: assets
